# Runs the tests on every push and pull request. Two checks:
# - Tests: every test, with the in-memory storage (the PostgreSQL tests are skipped).
# - PostgreSQL tests: tests/test_postgres.py against a real PostgreSQL server.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v

  postgres:
    name: PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # The same major version as production (Neon runs 18).
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: darsai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway database that exists only while this job runs. Its name must contain "test".
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/darsai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_postgres -v
